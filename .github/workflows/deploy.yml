# Workflow de Deploy Contínuo (CD)
# Executa testes, build e deploy para Vercel apenas em push para a branch main
# Garante que somente código validado chegue ao ambiente de produção

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Faz o checkout do código-fonte do repositório
      - uses: actions/checkout@v4

      # Configura o Node.js na versão 20 com cache do npm para acelerar instalações
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Instala as dependências de forma determinística usando o package-lock.json
      - name: Instalar dependências
        run: npm ci

      # Executa a suíte de testes com relatório de cobertura antes do deploy
      # Impede o deploy caso algum teste falhe
      - name: Executar testes com cobertura
        run: npm run test:coverage
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Gera os artefatos otimizados de produção na pasta dist/
      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Realiza o deploy do artefato gerado para o ambiente de produção na Vercel
      # Requer os secrets VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID configurados no repositório
      - name: Deploy para Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
