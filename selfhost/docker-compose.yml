services:
  db:
    image: supabase/postgres:17.6.1.173
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Authenticator/supabase_auth_admin/supabase_storage_admin já existem na imagem
  # supabase/postgres (sem senha) — este serviço roda uma vez, depois do db saudável,
  # pra dar senha a eles. Sem bind mount (o Save do EasyPanel limpa qualquer arquivo
  # fora dos que ele mesmo gerencia), por isso isso é feito via comando, não init script.
  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        psql -h db -U supabase_admin -d postgres -c "ALTER USER authenticator WITH PASSWORD '$$PGPASSWORD'"
        psql -h db -U supabase_admin -d postgres -c "ALTER USER supabase_auth_admin WITH PASSWORD '$$PGPASSWORD'"
        psql -h db -U supabase_admin -d postgres -c "ALTER USER supabase_storage_admin WITH PASSWORD '$$PGPASSWORD'"

  auth:
    image: supabase/gotrue:v2.180.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # Emails são sintéticos (<cpf>@fleetmanager.com, ver src/pages/Login.tsx) — nunca chegam
      # a uma caixa real, então confirmação por e-mail tem que ser automática.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  rest:
    image: postgrest/postgrest:v13.0.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: supabase/storage-api:v1.28.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: fleet
      REGION: local
      GLOBAL_S3_BUCKET: unused
      PGRST_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - storage-data:/var/lib/storage

  # Config do nginx embutida no command (sem bind mount) pelo mesmo motivo do db-init.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - rest
      - auth
      - storage
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINXCONF'
        server {
            listen 8080;

            location /auth/v1/ {
                proxy_pass http://auth:9999/;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            }

            location /rest/v1/ {
                proxy_pass http://rest:3000/;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            }

            location /storage/v1/ {
                proxy_pass http://storage:5000/;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                client_max_body_size 50M;
            }
        }
        NGINXCONF
        exec nginx -g 'daemon off;'

volumes:
  db-data:
  storage-data:
